services:
  - type: web
    name: chi-contact-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        value: countherin2023@gmail.com
      - key: CLIENT_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_URL
        sync: false